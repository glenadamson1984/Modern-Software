<text x="88" y="487" font-size="92" font-weight="800" letter-spacing="-5">SEAG practice.</text><text x="88" y="588" font-size="92" font-weight="800" letter-spacing="-5">A clearer next step.</text><path d="M490 612Q650 597 836 608" fill="none" stroke="#f6bba5" stroke-width="11" stroke-linecap="round"/>
<text x="94" y="689" font-size="29">Help your child build confidence in English and</text><text x="94" y="733" font-size="29">maths, one manageable session at a time.</text>
<text x="94" y="801" font-size="23" fill="#597269">Original papers. Clear explanations.</text><text x="94" y="837" font-size="23" fill="#597269">A bigger picture for the person cheering them on.</text>
<rect x="94" y="889" width="330" height="74" rx="12" fill="#173d36"/><text x="259" y="935" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">Try one full paper free ↗</text><text x="464" y="935" font-size="23" font-weight="600">Explore membership</text>
<circle cx="1393" cy="591" r="315" fill="#e0eed7"/><ellipse cx="1393" cy="591" rx="341" ry="364" fill="none" stroke="#d0dfc6" stroke-width="2" transform="rotate(-18 1393 591)"/>
<g transform="translate(1032 310) rotate(2 325 285)" filter="url(#shadow)"><rect width="654" height="552" rx="28" fill="#fff" stroke="#dce5d5" stroke-width="2"/><rect x="34" y="34" width="66" height="66" rx="18" fill="#dcf3c2"/><text x="67" y="80" text-anchor="middle" font-size="34" font-weight="700">½</text><text x="122" y="76" font-size="17" font-weight="700" letter-spacing="1">MATHS · FRACTIONS</text><rect x="475" y="50" width="141" height="34" rx="17" fill="#f1f5ec"/><text x="545" y="73" text-anchor="middle" font-size="14">A little practice</text><text x="35" y="174" font-size="43" font-weight="800" letter-spacing="-1">What is ¾ of 28?</text>
