<text x="762" y="97" font-size="20" font-weight="600">Free practice</text><text x="943" y="97" font-size="20" font-weight="600">Practice papers</text><text x="1157" y="97" font-size="20" font-weight="600">Parent guide</text><rect x="1440" y="53" width="284" height="66" rx="12" fill="#173d36"/><text x="1582" y="95" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Parent dashboard ↗</text>
<rect y="150" width="1800" height="76" fill="#dcf3c2"/><text x="78" y="196" font-size="17" font-weight="700" letter-spacing="2">FRESH PAPERS. ON THE 1ST AND 15TH.</text><text x="1724" y="196" text-anchor="end" font-size="18">English &amp; maths · Worked answers · Parent progress</text>
