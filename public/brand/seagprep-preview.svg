<rect x="35" y="326" width="576" height="159" rx="16" fill="#f3f7ef"/><text x="61" y="367" font-size="24" font-weight="700">Let’s break it down.</text><text x="61" y="410" font-size="23" fill="#597269">One quarter of 28 is 7.</text><text x="61" y="447" font-size="23" fill="#597269">Three quarters is 3 × 7 = <tspan font-weight="700" fill="#173d36">21.</tspan></text><text x="35" y="523" font-size="16" fill="#597269">Understanding comes first.</text><text x="596" y="523" font-size="24">✦</text></g>
<g transform="translate(1154 884) rotate(-3)"><rect width="543" height="110" rx="20" fill="#173d36"/><circle cx="53" cy="55" r="25" fill="#dcf3c2"/><text x="53" y="64" text-anchor="middle" font-size="27" font-weight="700">✓</text><text x="101" y="45" fill="#fff" font-size="22" font-weight="700">Every finished paper tells a story.</text><text x="101" y="78" fill="#c8dec3" font-size="19">Follow progress in your parent dashboard.</text></g>
